<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Love you</title>
<style>
  :root {
    --bg: #0a0505;
    --red: #ff4d6d;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    box-sizing: border-box;
  }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    overflow: hidden;
    font-family: "Fira Code", "Courier New", monospace;
  }
  .stage {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .heart-glow {
    position: absolute;
    clip-path: polygon(50% 15%, 61% 3%, 75% 0%, 87% 3%, 95% 10%, 100% 20%,
                        100% 30%, 95% 45%, 85% 60%, 70% 75%, 50% 90%,
                        30% 75%, 15% 60%, 5% 45%, 0% 30%, 0% 20%,
                        5% 10%, 13% 3%, 25% 0%, 39% 3%);
    background: radial-gradient(circle at 50% 45%, rgba(255,77,109,0.35), rgba(255,77,109,0) 70%);
    filter: blur(6px);
  }
  .heart {
    position: absolute;
    clip-path: polygon(50% 15%, 61% 3%, 75% 0%, 87% 3%, 95% 10%, 100% 20%,
                        100% 30%, 95% 45%, 85% 60%, 70% 75%, 50% 90%,
                        30% 75%, 15% 60%, 5% 45%, 0% 30%, 0% 20%,
                        5% 10%, 13% 3%, 25% 0%, 39% 3%);
  }
  .word {
    position: absolute;
    color: var(--red);
    white-space: nowrap;
    user-select: none;
    text-shadow: 0 0 8px rgba(255,77,109,0.6);
    opacity: 0;
    animation-name: appear-disappear;
    animation-iteration-count: infinite;
    animation-timing-function: ease-in-out;
  }
  @keyframes appear-disappear {
    0%   { opacity: 0; }
    15%  { opacity: 1; }
    45%  { opacity: 1; }
    70%  { opacity: 0; }
    100% { opacity: 0; }
  }
  .center-text {
    position: relative;
    z-index: 10;
    color: #fff;
    font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
    font-size: clamp(24px, 5.5vw, 50px);
    font-weight: 500;
    text-shadow: 0 0 10px rgba(255,255,255,0.5), 0 0 20px rgba(255,255,255,0.3);
    letter-spacing: 1px;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="heart-glow" id="glow"></div>
    <div class="heart" id="heart"></div>
    <div class="center-text">Love you.</div>
  </div>

<script>
  const stage = document.getElementById('stage');
  const heart = document.getElementById('heart');
  const glow  = document.getElementById('glow');

  const size = Math.min(stage.clientWidth, stage.clientHeight) * 0.85;
  [heart, glow].forEach(el => {
    el.style.width = size + 'px';
    el.style.height = size + 'px';
    el.style.left = (stage.clientWidth  - size) / 2 + 'px';
    el.style.top  = (stage.clientHeight - size) / 2 + 'px';
  });

  const count = 220;
  for (let i = 0; i < count; i++) {
    const el = document.createElement('span');
    el.className = 'word';
    el.textContent = 'i love you';
    el.style.left = (Math.random() * 100) + '%';
    el.style.top  = (Math.random() * 100) + '%';
    el.style.fontSize = (8 + Math.random() * 10) + 'px';
    el.style.transform = `rotate(${(Math.random() - 0.5) * 12}deg)`;
    el.style.animationDuration = (2.5 + Math.random() * 3) + 's';
    el.style.animationDelay = (Math.random() * 5) + 's';
    heart.appendChild(el);
  }
</script>
</body>
</html>
